<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="PaperPal">
  <title>PaperPal</title>
  <!-- Folded corner, filled with the pale "fold" blue. Drawn before the
       outline so the stroke sits on top of the fill edge. -->
  <path d="M42 7V22H57Z" fill="#B9D1FF"/>
  <g stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Page silhouette: the top-right corner is cut by the fold diagonal. -->
    <path d="M42 7H18A11 11 0 0 0 7 18V46A11 11 0 0 0 18 57H46A11 11 0 0 0 57 46V22Z"/>
    <!-- The fold's two legs; its hypotenuse is the silhouette diagonal. -->
    <path d="M42 7V22H57"/>
    <!-- Face. The brows clear the fold's lower leg by 7 units so the two
         never read as one line at small sizes. -->
    <path d="M17 29H26"/>
    <path d="M38 29H47"/>
    <path d="M26 43Q32 48 38 43"/>
  </g>
  <circle cx="21.5" cy="35" r="3" fill="#2563EB"/>
  <circle cx="42.5" cy="35" r="3" fill="#2563EB"/>
</svg>
